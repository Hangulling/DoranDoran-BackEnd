spring:
  application:
    name: store-service

  # Spring Security 완전 비활성화
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  # 데이터베이스 연결
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
      connection-test-query: SELECT 1
      validation-timeout: 5000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
      default_schema: store_schema
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        connection:
          characterEncoding: UTF-8
          useUnicode: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: redis  # Docker 환경
      port: 6379

server:
  port: 8084
  address: 0.0.0.0

# 로깅
logging:
  level:
    com.dorandoran.store: DEBUG

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  security:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

# Feign Client 설정 추가
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: FULL
  chat-service:
    url: http://dorandoran-chat:8083  # ⭐ localhost → 도커 서비스명으로 변경
  circuitbreaker:
    enabled: true

gateway:
  jwt:
    hmac-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    skew-ms: 60000

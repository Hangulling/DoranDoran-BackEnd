services:
  # 공유 데이터베이스 (PostgreSQL)
  shared-db:
    image: postgres:17-alpine
    container_name: dd-shared-db
    environment:
      POSTGRES_DB: dorandoran
      POSTGRES_USER: doran
      POSTGRES_PASSWORD: doran
      POSTGRES_HOST_AUTH_METHOD: trust
      LC_ALL: ko_KR.UTF-8
      LANG: ko_KR.UTF-8
    ports: ["5432:5432"]
    volumes:
      - shared_db_data:/var/lib/postgresql/data
      - ./scripts/init-shared-db.sql:/docker-entrypoint-initdb.d/init-shared-db.sql
    # command 라인 주석 처리: 메모리 부족 방지를 위해 기본값(100개 연결) 유지
    # command: postgres -c max_connections=150 -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doran -d dorandoran"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: dd-redis
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Auth Service
  auth-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.auth
    container_name: dorandoran-auth
    ports: ["8081:8081"]
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-db:5432/dorandoran
      - SPRING_DATASOURCE_USERNAME=doran
      - SPRING_DATASOURCE_PASSWORD=doran
      - SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA=auth_schema
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      shared-db:
        condition: service_healthy
      redis:
        condition: service_started

  # User Service
  user-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.user
    container_name: dorandoran-user
    ports: ["8082:8082"]
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-db:5432/dorandoran       
      - SPRING_DATASOURCE_USERNAME=doran
      - SPRING_DATASOURCE_PASSWORD=doran
      - SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA=user_schema
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      shared-db:
        condition: service_healthy
      redis:
        condition: service_started

  # Chat Service
  chat-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.chat
    container_name: dorandoran-chat
    ports: ["8083:8083"]
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-db:5432/dorandoran
      - SPRING_DATASOURCE_USERNAME=doran
      - SPRING_DATASOURCE_PASSWORD=doran
      - SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA=chat_schema
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      shared-db:
        condition: service_healthy
      redis:
        condition: service_started

  # Store Service
  store-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.store
    container_name: dorandoran-store
    ports: ["8084:8084"]
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-db:5432/dorandoran
      - SPRING_DATASOURCE_USERNAME=doran
      - SPRING_DATASOURCE_PASSWORD=doran
      - SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA=store_schema
      - FEIGN_CHAT_SERVICE_URL=http://dorandoran-chat:8083
    depends_on:
      shared-db:
        condition: service_healthy
      chat-service:
        condition: service_started

  # Batch Service
  batch-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.batch
    container_name: dorandoran-batch
    ports: ["8085:8085"]
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://shared-db:5432/dorandoran
      - SPRING_DATASOURCE_USERNAME=doran
      - SPRING_DATASOURCE_PASSWORD=doran
      - SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA=batch_schema
    depends_on:
      shared-db:
        condition: service_healthy

  # API Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: dorandoran-gateway
    ports: ["8080:8080"]
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      - user-service
      - auth-service
      - chat-service
      - store-service
      - batch-service
      - redis

  # Prometheus 모니터링
  prometheus:
    image: prom/prometheus:latest
    container_name: dd-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - api-gateway
      - auth-service
      - user-service
      - chat-service
      - store-service
      - batch-service

  # Grafana 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: dd-grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki

  # Loki 로그 수집
  loki:
    image: grafana/loki:latest
    container_name: dd-loki
    ports: ["3100:3100"]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/loki-config.yml
    depends_on:
      - prometheus

  # Promtail 로그 수집 에이전트
  promtail:
    image: grafana/promtail:latest
    container_name: dd-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dd-postgres-exporter
    ports: ["9187:9187"]
    environment:
      - DATA_SOURCE_NAME=postgresql://doran:doran@shared-db:5432/dorandoran?sslmode=disable
    depends_on:
      - shared-db

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: dd-redis-exporter
    ports: ["9121:9121"]
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  # AlertManager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: dd-alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus

volumes:
  shared_db_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

networks:
  default:
    name: dorandoran-msa-network

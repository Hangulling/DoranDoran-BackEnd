server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  # 웹 애플리케이션 타입을 reactive로 설정 (Gateway용)
  main:
    web-application-type: reactive
  
  # JPA 자동 설정 비활성화
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
  
  # Redis 설정
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  cloud:
    gateway:
      httpclient:
        connect-timeout: 45000  # 연결 타임아웃 (45초)
        response-timeout: 600s  # 응답 타임아웃 (SSE용 10분)
        pool:
          type: ELASTIC
          max-connections: 500
          max-idle-time: 30s
        # Netty 타임아웃 설정 (SSE용)
        options:
          SO_KEEPALIVE: true
          TCP_NODELAY: true
      routes:
        # Auth 서비스 라우팅
        - id: auth-service
          uri: http://dorandoran-auth:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/auth/$\{segment}
            - name: Retry
              args:
                retries: 2
                methods: GET
                backoff:
                  firstBackoff: 200ms
                  factor: 2
                  maxBackoff: 500ms
                  basedOnPreviousValue: true

        # User 서비스 라우팅
        - id: user-service
          uri: http://dorandoran-user:8082
          predicates:
            - Path=/api/users/**
          filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                backoff:
                  firstBackoff: 200ms
                  factor: 2
                  maxBackoff: 500ms
                  basedOnPreviousValue: true
        
        # Chat 서비스 라우팅
        - id: chat-service
          uri: http://dorandoran-chat:8083
          predicates:
            - Path=/api/chat/**
          filters: []

        # Store 서비스 라우팅
        - id: store-service
          uri: http://dorandoran-store:8084
          predicates:
            - Path=/api/store/**
          filters: []

        # Batch 서비스 라우팅
        - id: batch-service
          uri: http://dorandoran-batch:8085
          predicates:
            - Path=/api/batch/**
          filters: []
      

# 로깅 설정
logging:
  level:
    com.dorandoran.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Gateway 설정
gateway:
  auth:
    base-url: http://dorandoran-auth:8081  # Docker 서비스명 사용
    validate-path: /api/auth/validate
    exclusions:
      - /actuator
      - /
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/password/reset
      - /api/auth/health
      - /api/auth/email/request-verification
      - /api/auth/email/verify
      - /api/auth/email/check
      - /api/auth/oauth/login
      - /api/users/health
      - /api/users
      - /api/batch
  jwt:
    hmac-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    skew-ms: 3600000
  security:
    blacklist:

server:
  port: 8085

spring:
  application:
    name: batch-service
  
  # Flyway 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: archive_schema, batch_schema

  # Batch 서비스 공유 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/dorandoran
    username: doran
    password: doran
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5  # 하루 한 번 실행되므로 최소화
      minimum-idle: 1  # 평소에는 유휴 연결 최소화
      connection-timeout: 20000  # 연결 대기 시간 단축
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA 설정 (비활성화 - JDBC만 사용)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# 로깅 설정
logging:
  level:
    com.dorandoran.batch: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
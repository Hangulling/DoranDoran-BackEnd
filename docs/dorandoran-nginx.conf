# API Gateway (8080)
server {
    listen 443 ssl;
    http2 on;
    server_name api.doran-chat.com;

    ssl_certificate /etc/letsencrypt/live/api.doran-chat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.doran-chat.com/privkey.pem;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE 및 긴 연결을 위한 타임아웃 설정
        proxy_read_timeout 600s;      # 10분 (SSE용)
        proxy_connect_timeout 60s;    # 연결 타임아웃
        proxy_send_timeout 600s;      # 전송 타임아웃
        
        # 버퍼링 비활성화 (SSE용)
        proxy_buffering off;
        proxy_cache off;
        
        # HTTP/1.1 사용 (SSE 호환성)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 추가 헤더
        proxy_set_header X-Accel-Buffering "no";
    }
    
    # SSE 스트림 엔드포인트에 대한 특별 설정
    location ~ ^/api/chat/stream/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE를 위한 긴 타임아웃
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        
        # 버퍼링 완전 비활성화
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # HTTP/1.1 강제 사용
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 추가 헤더 (CORS는 Gateway에서 처리)
        proxy_set_header X-Accel-Buffering "no";
    }
    
    # WebSocket 채팅 엔드포인트 (api.doran-chat.com -> Gateway -> Chat)
    location /ws/chat/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering "no";
    }
}

# Chat Service (8083) - WebSocket 지원
server {
    listen 443 ssl;
    http2 on;
    server_name chat.doran-chat.com;

    ssl_certificate /etc/letsencrypt/live/api.doran-chat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.doran-chat.com/privkey.pem;

    location / {
        proxy_pass http://localhost:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}


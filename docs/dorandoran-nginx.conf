# HTTP to HTTPS 리다이렉트
server {
    listen 80;
    server_name api.doran-chat.com chat.doran-chat.com auth.doran-chat.com user.doran-chat.com store.doran-chat.com;
    return 301 https://$server_name$request_uri;
}

server:
  port: 8083
  address: 0.0.0.0

spring:
  application:
    name: chat-service
  
  # Spring Security 완전 비활성화
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  
  # Chat 서비스 공유 데이터베이스 설정
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dorandoran-shared-db:5432/dorandoran}
    username: ${SPRING_DATASOURCE_USERNAME:doran}
    password: ${SPRING_DATASOURCE_PASSWORD:doran}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50  # 동시 처리 능력 향상
      minimum-idle: 25  # 최소 유휴 연결 증가
      connection-timeout: 20000  # 연결 대기 시간 단축
      idle-timeout: 300000  # 유휴 연결 타임아웃
      max-lifetime: 600000  # 연결 최대 수명 단축 (10분)
      leak-detection-threshold: 10000  # 누수 조기 감지 (10초)
      connection-test-query: SELECT 1
      validation-timeout: 5000
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
      default_schema: chat_schema
    show-sql: false
    open-in-view: false  # SSE 연결 누수 방지
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        jdbc:
          time_zone: UTC
        # billing 스키마 접근을 위한 추가 설정
        default_schema: chat_schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Redis 설정 (Docker 프로필)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:dorandoran-redis}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# 로깅 설정
logging:
  level:
    com.dorandoran.chat: DEBUG
    com.dorandoran.chat.service.OpenAIClient: DEBUG

# AI 설정
ai:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.openai.com
    model: gpt-4o-mini
    max-output-tokens: 800
    # 테스트 모델 추가
    test-models:
      model-a: ${OPENAI_TEST_MODEL_A:gpt-4.1}
      model-b: ${OPENAI_TEST_MODEL_B:gpt-4.2}
      model-c: ${OPENAI_TEST_MODEL_C:gpt-5.1}
    # Agent별 설정
    agents:
      vocabulary:
        extraction:
          temperature: 0.2  # 정확한 추출을 위해 낮게 설정
          max-tokens: 300
        explanation:
          temperature: 0.5  # 자연스러운 설명을 위해 적당히 설정
          max-tokens: 200
      intimacy:
        analysis:
          temperature: 0.2  # 정확한 분석을 위해 낮게 설정
          max-tokens: 400
        correction:
          temperature: 0.5  # 자연스러운 교정을 위해 적당히 설정
          max-tokens: 300

# Gateway HMAC 검증 설정 (환경변수로 주입)
gateway:
  jwt:
    hmac-secret: ${GATEWAY_JWT_HMAC_SECRET:}
    skew-ms: 3600000

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true

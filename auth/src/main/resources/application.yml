server:
  port: 8081

spring:
  application:
    name: auth-service
  cloud:
    openfeign:
      okhttp:
        enabled: true
  
  # Flyway 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: auth_schema
  
  # Auth 서비스 공유 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/dorandoran
    username: doran
    password: doran
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10  # 토큰 검증만 수행, RefreshToken 저장용으로 충분
      minimum-idle: 5
      connection-timeout: 20000  # 연결 대기 시간 단축
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
      default_schema: auth_schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT 설정
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      access-token-expiration: 3600000  # 1시간
      refresh-token-expiration: 604800000  # 7일

email:
  verification:
    expiration-minutes: 5
    backend-url: ${BACKEND_URL:http://localhost:8081}
    # 인증 완료 후 무조건 앱으로 리디렉트 (앱 전용 기능)
    app-redirect-base: ${EMAIL_VERIFICATION_APP_REDIRECT:dorandoran://email-verified}

# 서비스 간 통신 설정
user:
  service:
    url: http://dorandoran-user:8082

# Circuit Breaker 설정
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      user-service:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2  
  timelimiter:
    instances:
      user-service:
        timeout-duration: 5s

# 로깅 설정
logging:
  level:
    com.dorandoran.auth: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

gateway:
  jwt:
    hmac-secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    skew-ms: 3600000

# Google OAuth 2.0 설정 (실제 값은 환경 변수 또는 로컬 전용 설정으로 주입)
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    android-client-ids: ${GOOGLE_OAUTH_ANDROID_CLIENT_IDS:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}

# Firebase 설정 (로컬 개발용, 프로덕션은 환경변수 사용)
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  private-key: ${FIREBASE_PRIVATE_KEY:}

# Apple Sign In 설정
# client-id: iOS 앱 Bundle ID 또는 Web용 Service ID (하나만 설정 시 사용)
# client-ids: 여러 개일 경우 쉼표로 구분 (iOS Bundle ID, Web Service ID 등)
apple:
  oauth:
    client-id: ${APPLE_OAUTH_CLIENT_ID:}
    client-ids: ${APPLE_OAUTH_CLIENT_IDS:}

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true
    showExtensions: true
    showCommonExtensions: true

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

  # Redis 설정 (토큰 블랙리스트용)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: 
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
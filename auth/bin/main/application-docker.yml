server:
  port: 8081

spring:
  application:
    name: auth-service
  cloud:
    openfeign:
      okhttp:
        enabled: true
  
  # Auth 서비스 공유 데이터베이스 설정
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dorandoran-shared-db:5432/dorandoran}
    username: ${SPRING_DATASOURCE_USERNAME:doran}
    password: ${SPRING_DATASOURCE_PASSWORD:doran}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 15
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
      default_schema: auth_schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Redis 설정 (Docker 프로필)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:dorandoran-redis}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          debug: true

email:
  verification:
    expiration-minutes: 5
    backend-url: ${BACKEND_URL:http://localhost:8081}
    app-redirect-base: ${EMAIL_VERIFICATION_APP_REDIRECT:dorandoran://email-verified}

# JWT 설정
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      access-token-expiration: 3600000  # 1시간
      refresh-token-expiration: 604800000  # 7일

# 서비스 간 통신 설정
user:
  service:
    url: ${USER_SERVICE_URL:http://dorandoran-user:8082}

# Circuit Breaker 설정
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        failure-rate-threshold: 70
        wait-duration-in-open-state: 8s
        sliding-window-size: 50
        minimum-number-of-calls: 20
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      user-service:
        max-attempts: 2
        wait-duration: 300ms
        exponential-backoff-multiplier: 1.8
  timelimiter:
    instances:
      user-service:
        timeout-duration: 5s

# 로깅 설정
logging:
  level:
    com.dorandoran.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.mail: DEBUG
    com.sun.mail: DEBUG
    jakarta.mail: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Gateway HMAC 검증 설정
gateway:
  jwt:
    hmac-secret: ${GATEWAY_JWT_HMAC_SECRET:}
    skew-ms: 3600000

# Google OAuth 2.0 설정 (환경변수로 주입)
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    android-client-ids: ${GOOGLE_OAUTH_ANDROID_CLIENT_IDS:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}

# Firebase 설정 (환경변수로 주입)
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  private-key: ${FIREBASE_PRIVATE_KEY:}

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

server:
  port: 8082

spring:
  application:
    name: user-service
  
  # Spring Security 완전 비활성화
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  
  # User 서비스 공유 데이터베이스 설정
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dorandoran-shared-db:5432/dorandoran}
    username: ${SPRING_DATASOURCE_USERNAME:doran}
    password: ${SPRING_DATASOURCE_PASSWORD:doran}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 15
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
      default_schema: user_schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Redis 설정 (Docker 프로필)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:dorandoran-redis}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# 로깅 설정
logging:
  level:
    com.dorandoran.user: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# 서비스 간 통신 설정
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://dorandoran-auth:8081}

chat:
  service:
    url: ${CHAT_SERVICE_URL:http://dorandoran-chat:8083}

instagram:
  enabled: ${INSTAGRAM_ENABLED:false}
  access-token: ${INSTAGRAM_ACCESS_TOKEN:}
  user-id: ${INSTAGRAM_USER_ID:}
  refresh:
    cron: ${INSTAGRAM_REFRESH_CRON:0 5 9 * * *}

notification:
  daily:
    cron: ${NOTIFICATION_DAILY_CRON:0 0 9 * * *}

firebase:
  admin:
    json: ${FIREBASE_ADMIN_JSON:}
    json-base64: ${FIREBASE_ADMIN_JSON_BASE64:}

app:
  deeplink:
    scheme: ${APP_DEEPLINK_SCHEME:dorandoran://chat}
    universal-base: ${APP_DEEPLINK_UNIVERSAL_BASE:https://www.doran-chat.com/chat}

# Gateway HMAC 검증 설정 (환경변수로 주입)
gateway:
  jwt:
    hmac-secret: ${GATEWAY_JWT_HMAC_SECRET:}
    skew-ms: 3600000

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  security:
    enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

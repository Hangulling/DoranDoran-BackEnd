server:
  port: 8082

spring:
  application:
    name: user-service
  
  # Flyway 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: user_schema
  
  # Spring Security 자동 생성 비밀번호 비활성화
  security:
    user:
      name: disabled
      password: disabled
  
  # User 서비스 공유 데이터베이스 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/dorandoran
    username: doran
    password: doran
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15  # 메모리 제약 고려하여 적절한 수준 유지
      minimum-idle: 5
      connection-timeout: 20000  # 연결 대기 시간 단축
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: none
      default_schema: user_schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# 로깅 설정
logging:
  level:
    com.dorandoran.user: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Spring Security 자동 생성 비밀번호 메시지 숨기기
    org.springframework.boot.autoconfigure.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

gateway:
  jwt:
    hmac-secret: ${GATEWAY_JWT_HMAC_SECRET:}
    skew-ms: 3600000

# 서비스 간 통신 설정
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

chat:
  service:
    url: ${CHAT_SERVICE_URL:http://localhost:8083}

instagram:
  enabled: ${INSTAGRAM_ENABLED:false}
  access-token: ${INSTAGRAM_ACCESS_TOKEN:}
  user-id: ${INSTAGRAM_USER_ID:}
  refresh:
    cron: ${INSTAGRAM_REFRESH_CRON:0 5 9 * * *}

notification:
  daily:
    cron: ${NOTIFICATION_DAILY_CRON:0 0 9 * * *}

firebase:
  admin:
    json: ${FIREBASE_ADMIN_JSON:}
    json-base64: ${FIREBASE_ADMIN_JSON_BASE64:}

app:
  deeplink:
    scheme: ${APP_DEEPLINK_SCHEME:dorandoran://chat}
    universal-base: ${APP_DEEPLINK_UNIVERSAL_BASE:https://www.doran-chat.com/chat}

# SpringDoc OpenAPI 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true
    showExtensions: true
    showCommonExtensions: true

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
